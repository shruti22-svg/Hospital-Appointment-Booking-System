services:
  app:
    build: .
    environment:
      PORT: 5000
      HOST: 0.0.0.0
    expose:
      - "5000"

  chrome:
    image: selenium/standalone-chrome:4.27.0
    shm_size: 2gb
    depends_on:
      - app

  tests:
    build:
      context: .
      dockerfile: tests/selenium/Dockerfile
    environment:
      BASE_URL: http://app:5000
      SELENIUM_REMOTE_URL: http://chrome:4444/wd/hub
    depends_on:
      - app
      - chrome
