<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin registration</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <header id="site-header" class="topbar"></header>
    <main>
        <div class="page-head">
            <h1>Admin registration</h1>
            <p>Create an admin account to manage hospital appointments.</p>
        </div>
        <form id="admin-register-form" class="card form-narrow">
            <label>Full name<input id="admin-name" name="name" required placeholder="Admin name"></label>
            <label>Email<input id="admin-email" name="email" type="email" required placeholder="admin@email.com"></label>
            <label>Password<input id="admin-password" name="password" type="password" minlength="8" required placeholder="Min 8 characters"></label>
            <button id="admin-register-btn" type="submit">Create admin account</button>
            <p id="admin-register-message" class="message"></p>
            <p>Already an admin? <a href="/admin-login.html">Go to admin login</a></p>
        </form>
    </main>
    <script src="/js/common.js"></script>
    <script src="/js/admin-register.js"></script>
</body>
</html>
