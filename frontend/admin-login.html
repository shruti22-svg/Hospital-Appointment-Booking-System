<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin login</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <header id="site-header" class="topbar"></header>
    <main>
        <div class="page-head">
            <h1>Admin login</h1>
            <p>Sign in to manage all hospital appointments.</p>
        </div>
            <form id="admin-login-form" class="card form-narrow">
            <p id="banner" class="message"></p>
            <label>Email<input id="admin-login-email" name="email" type="email" required placeholder="you@email.com"></label>
            <label>Password<input id="admin-login-password" name="password" type="password" required></label>
            <button id="admin-login-btn" type="submit">Admin access</button>
            <p id="admin-login-message" class="message"></p>
            <p>New admin? <a href="/admin-register.html">Register here</a></p>
            <p class="hint">Optional demo admin: admin@hospital.com / Admin@123</p>
        </form>
    </main>
    <script src="/js/common.js"></script>
    <script src="/js/admin-login.js"></script>
</body>
</html>
