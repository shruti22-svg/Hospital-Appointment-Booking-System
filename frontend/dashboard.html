<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient dashboard</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <header id="site-header" class="topbar"></header>
    <main>
        <div class="page-head">
            <h1 id="welcome-title">Dashboard</h1>
            <p>Search doctors, view details, book slots, and manage appointments.</p>
        </div>
        <div class="stats" id="dashboard-stats"></div>
        <div class="cards">
            <a class="card link-card" href="/search.html">
                <h3>Search doctors by specialization</h3>
                <p>Find a cardiologist, dermatologist, and more.</p>
            </a>
            <a class="card link-card" href="/doctors.html">
                <h3>Doctor details</h3>
                <p>See all hospital specialists.</p>
            </a>
            <a class="card link-card" href="/appointments.html">
                <h3>View / cancel appointments</h3>
                <p>Check booking details or cancel a visit.</p>
            </a>
        </div>
    </main>
    <script src="/js/common.js"></script>
    <script src="/js/dashboard.js"></script>
</body>
</html>
